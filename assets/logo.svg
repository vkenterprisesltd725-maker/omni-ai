<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D" />
      <stop offset="50%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F4F4F5" />
      <stop offset="70%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#71717A" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#27272A" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- The OmniAI Nexus Symbol (Omega + Infinity Loop + Gateway) -->
  <g transform="translate(256, 264)">
    <!-- Base Outer Arch of Omega / Infinity Loop -->
    <path d="M -136 112 
             L -80 112 
             C -48 112, -38 84, -38 56
             C -38 -20, -108 -70, -108 -128
             C -108 -192, -58 -208, 0 -208
             C 58 -208, 108 -192, 108 -128
             C 108 -70, 38 -20, 38 56
             C 38 84, 48 112, 80 112
             L 136 112"
          fill="none" 
          stroke="url(#metalGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Secondary Harmonic Ribbon (Inner Loop) -->
    <path d="M -102 112
             C -68 112, -48 68, 0 -28
             C 48 68, 68 112, 102 112"
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Central Intelligent Gateway Core (Diamond Hex-Facet) -->
    <polygon points="0,-156 36,-114 0,-72 -36,-114" fill="url(#coreGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#softGlow)" />
    <!-- Core Inner Light Pulse -->
    <circle cx="0" cy="-114" r="6" fill="#FFFFFF" />

    <!-- Client / Local Gateway Sockets -->
    <circle cx="-132" cy="112" r="9" fill="#FFFFFF" />
    <circle cx="132" cy="112" r="9" fill="#F59E0B" />
  </g>
</svg>
